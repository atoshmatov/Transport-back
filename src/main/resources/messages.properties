# Centralized, human-facing error/message text for the whole backend.
#
# Every ApiException subtype (see common.exception.ApiExceptions) takes a
# message-key + positional args instead of a literal string, and resolves the
# final text here via common.exception.Messages -> Spring's MessageSource.
# {0}, {1}, ... are java.text.MessageFormat placeholders, filled positionally
# from the exception's constructor args.
#
# This file is the default/fallback bundle (no locale suffix), currently
# holding the Uzbek text the app has always shown. To add another language
# later, add messages_ru.properties / messages_en.properties with the same
# keys — Spring resolves by Accept-Language automatically (no code change).

