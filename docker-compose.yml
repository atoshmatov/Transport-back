# Local infrastructure only — the Spring Boot app itself runs via
# `./gradlew bootRun` on the host for now (see README.md). A backend
# container/service can be added here once the app is packaged.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: transport-observer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: transport_observer
      POSTGRES_USER: transport_observer
      POSTGRES_PASSWORD: transport_observer
    ports:
      # Host port 5433 -> container 5432. Host 5432 is already taken by a
      # native PostgreSQL Windows service (postgresql-x64-18) on this
      # machine, so the container is remapped to avoid a port clash.
      - "5433:5432"
    volumes:
      - transport_observer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport_observer -d transport_observer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: transport-observer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - transport_observer_redis_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: transport-observer-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI: http://localhost:15672
    volumes:
      - transport_observer_rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: transport-observer-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console UI: http://localhost:9001
    volumes:
      - transport_observer_minio_data:/data

volumes:
  transport_observer_postgres_data:
  transport_observer_redis_data:
  transport_observer_rabbitmq_data:
  transport_observer_minio_data:
